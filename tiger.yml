lib:
  createRbelHtmlReports: ${GENERATE_RBEL_LOGS|true}
tigerProxy:
  tls:
    forwardMutualTlsIdentity: "${TIM_KEYSTORE};${TIM_KEYSTORE_PW};pkcs12"
  activateRbelParsing: ${GENERATE_RBEL_LOGS|true}
  rbelBufferSizeInMb: ${RBEL_BUFFER_SIZE_MB|1024}

servers:
  testdriverApi-A-WIN-Client:
    type: externalUrl
    source:
      - https://localhost:8080
    healthcheckUrl: https://localhost:8080/actuator/health

  testdriverApi-A-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-A-WIN-Client
    source:
      - https://localhost:8081
    healthcheckUrl: https://localhost:8081/actuator/health

  testdriverApi-B-WIN-Client:
    type: externalUrl
    dependsUpon: testdriverApi-A-ORG
    source:
      - https://localhost:8082
    healthcheckUrl: https://localhost:8082/actuator/health

  testdriverApi-B-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-B-WIN-Client
    source:
      - https://localhost:8083
    healthcheckUrl: https://localhost:8083/actuator/health

  testdriverApi-C-IOS-Insurant:
    type: externalUrl
    dependsUpon: testdriverApi-B-ORG
    source:
      - https://localhost:8084
    healthcheckUrl: https://localhost:8084/actuator/health

  testdriverApi-D-WIN-Pro:
    type: externalUrl
    dependsUpon: testdriverApi-C-IOS-Insurant
    source:
      - https://localhost:8085
    healthcheckUrl: https://localhost:8085/actuator/health

  testdriverApi-D-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-D-WIN-Pro
    source:
      - https://localhost:8086
    healthcheckUrl: https://localhost:8086/actuator/health

  testdriverApi-E-WIN-Pro:
    type: externalUrl
    dependsUpon: testdriverApi-D-ORG
    source:
      - https://localhost:8087
    healthcheckUrl: https://localhost:8087/actuator/health

  testdriverApi-E-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-E-WIN-Pro
    source:
      - https://localhost:8088
    healthcheckUrl: https://localhost:8088/actuator/health

  testdriverApi-F-AND-Insurant-V3:
    type: externalUrl
    dependsUpon: testdriverApi-E-ORG
    source:
      - https://localhost:8089
    healthcheckUrl: https://localhost:8089/actuator/health

  testdriverApi-G-AND-Pro-V3:
    type: externalUrl
    dependsUpon: testdriverApi-F-AND-Insurant-V3
    source:
      - https://localhost:8090
    healthcheckUrl: https://localhost:8090/actuator/health

  testdriverApi-G-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-G-AND-Pro-V3
    source:
      - https://localhost:8091
    healthcheckUrl: https://localhost:8091/actuator/health

  testdriverApi-H-AND-Ref-Impl:
    type: externalUrl
    dependsUpon: testdriverApi-G-ORG
    source:
      - https://localhost:8092
    healthcheckUrl: https://localhost:8092/actuator/health

  testdriverApi-H-ORG:
    type: externalUrl
    dependsUpon: testdriverApi-H-AND-Ref-Impl
    source:
      - https://localhost:8093
    healthcheckUrl: https://localhost:8093/actuator/health
